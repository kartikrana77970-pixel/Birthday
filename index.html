# Birthday
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday bhootu👻❤️</title>

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        text-align: center;
        color: #fff;
        overflow-x: hidden;
    }

    .container {
        margin-top: 80px;
    }

    h1 {
        font-size: 40px;
        animation: fadeIn 2s ease-in-out;
    }

    p {
        font-size: 20px;
        margin: 20px;
        animation: fadeIn 3s ease-in-out;
    }

    .btn {
        background: #fff;
        color: #ff5e78;
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #ff5e78;
        color: #fff;
    }

    #hiddenMessage {
        display: none;
        margin-top: 30px;
        font-size: 22px;
        animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    /* Floating hearts */
    .heart {
        position: fixed;
        bottom: -10px;
        font-size: 20px;
        animation: float 5s linear infinite;
    }

    @keyframes float {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-100vh); opacity: 0; }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Happy Birthday my softuu🫂🪷</h1>

    <p>
        Aaj ka din special hai… kyunki tum ho 😊❤️ <br><br>
        You made my days better without even trying...
    </p>

    <button class="btn" onclick="showMessage()">Click here 💌</button>

    <div id="hiddenMessage">
        Sach bolu… tum meri life me aake sab kuch kaafi better kar diya hai ❤️ <br>
        Stay the same, always 🌸
    </div>
</div>
<img src="IMG_20260320_155102_743.jpg" width="200" style="border-radius:15px; margin:10px;">
<img src="IMG_20260301_102550_730.jpg" width="200" style="border-radius:15px; margin:10px;">
<script>
function showMessage() {
    document.getElementById("hiddenMessage").style.display = "block";
}

// Floating hearts generator
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}, 500);
</script>

</body>
</html>
