<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    text-align: center;
    color: white;
}

.container {
    margin-top: 80px;
}

h1 {
    font-size: 28px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #ff4d6d;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
}

.step {
    display: none;
    margin-top: 20px;
}

img {
    width: 200px;
    border-radius: 15px;
    margin: 10px;
}

/* hearts */
.heart {
    position: fixed;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity:1; }
    100% { transform: translateY(-100vh); opacity:0; }
}
</style>

</head>

<body>

<div class="container">

<h1>Happy Birthday softuu 🫂🌸</h1>

<button onclick="nextStep()">Start 💌</button>

<div id="step1" class="step">
<p>Aaj ka din special hai... kyunki tum ho 😊❤️</p>
<button onclick="nextStep2()">Next ➡️</button>
</div>

<div id="step2" class="step">
<p>Tumne bina try kiye meri life better bana di 💖</p>
<button onclick="nextStep3()">Next ➡️</button>
</div>

<div id="step3" class="step">
<p>Sach bolu... tum meri life ka best part ho ❤️</p>
<img src="IMG_20260320_155102_743.jpg">
<img src="IMG_20260301_102550_730.jpg">
<button onclick="nextStep4()">Final 💝</button>
</div>

<div id="step4" class="step">
<h2>Stay the same always 🌸❤️</h2>
<p>I really like you… 🫂</p>
</div>

</div>

<script>

function nextStep(){
    document.getElementById("step1").style.display="block";
}

function nextStep2(){
    document.getElementById("step2").style.display="block";
}

function nextStep3(){
    document.getElementById("step3").style.display="block";
}

function nextStep4(){
    document.getElementById("step4").style.display="block";
}

/* hearts animation */
setInterval(()=>{
    let heart = document.createElement("div");
    heart.className="heart";
    heart.innerText="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+10)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>{ heart.remove(); },5000);
},400);

</script>

</body>
</html>
